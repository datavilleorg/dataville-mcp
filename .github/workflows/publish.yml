name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) requires npm 11.5.1+
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public

  # Separate job so a registry failure can be re-run without re-publishing npm
  # (which would fail: the version already exists).
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Set server.json version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      # DNS auth proves control of dataville.com, which grants the com.dataville/ namespace.
      - name: Log in to MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain dataville.com --private-key "$MCP_PRIVATE_KEY"
      # The registry validates the package against npm, which can take a minute
      # to serve a version it just accepted (v0.1.6 failed this way).
      - name: Wait for the version to appear on npm
        run: |
          SPEC="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            npm view "$SPEC" version >/dev/null 2>&1 && exit 0
            echo "Waiting for $SPEC on npm ($i/30)..."
            sleep 10
          done
          echo "$SPEC did not appear on npm within 5 minutes" >&2
          exit 1
      - run: ./mcp-publisher publish
