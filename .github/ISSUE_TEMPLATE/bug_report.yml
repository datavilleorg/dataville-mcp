name: Bug report
description: Something isn't working with the Dataville MCP server
labels: ["bug"]
assignees: ["mansipathak"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include your API key in this issue —
        redact it as `dataville_...` in any config or logs you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the prompt or tool call you made, if relevant.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package version
      description: "Output of `npm view @dataville/dataville-mcp version`, or the version in your lockfile."
      placeholder: 0.1.2
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - Windsurf
        - VS Code
        - Other
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: "Output of `node --version`."
      placeholder: v22.0.0

  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Any error message returned by the tool, with your API key redacted.
      render: shell
